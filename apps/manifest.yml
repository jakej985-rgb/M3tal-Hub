  - id: shop-manager
    name: Shop Manager
    repo: Shop-manager
    path: shop-manager
    type: desktop
    platforms: [desktop, linux, windows]
    enabled: false
    status: review
    version: "0.1.0"
    package: binary
    description: Studio operations and inventory management system.
    repo_url: https://github.com/jakej985-rgb/Shop-manager
    release_url: https://github.com/jakej985-rgb/Shop-manager/releases
    changelog:
      - version: "0.1.0"
        date: "2026-09-30"
        tag: "Desktop Preview"
        notes:
          - "Modern Qt C++ desktop operations architecture."
          - "Inventory tracking, artist commission management, and studio scheduling."
          - "Cross-platform support for Linux and Windows desktop environments."
    install_guide:
      summary: "Shop Manager is a modern Qt C++ desktop operations suite designed for tattoo and piercing studios, providing inventory management, client tracking, appointment administration, and financial reporting across Linux and Windows desktop environments."
      prerequisites:
        - "Operating System: Linux (Ubuntu 22.04+, Debian 12+, Arch Linux, Fedora) or Windows 10/11 (64-bit)"
        - "C++20 compliant compiler: GCC 11+, Clang 14+, or Microsoft Visual C++ (MSVC 2022)"
        - "CMake >= 3.20 build system"
        - "Qt 6 (Qt6Core, Qt6Gui, Qt6Widgets, Qt6Sql) development packages"
        - "SQLite 3 or compatible database runtime"
      steps:
        - title: "📦 Pre-built Desktop Releases"
          content: "Pre-compiled native binaries for Linux (AppImage / .deb) and Windows installer (.exe / portable .zip) are available on GitHub Releases."
          code: |-
            # Linux AppImage:
            chmod +x ShopManager-x86_64.AppImage
            ./ShopManager-x86_64.AppImage

            # Windows (PowerShell / Command Prompt):
            .\ShopManager-Setup.exe
        - title: "🐧 Building from Source on Linux"
          content: "Install Qt 6 and build tools using your distribution package manager, then compile with CMake."
          code: |-
            # Debian / Ubuntu dependencies:
            sudo apt update && sudo apt install -y build-essential cmake ninja-build \
              qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite

            # Clone repository:
            git clone https://github.com/jakej985-rgb/Shop-manager.git
            cd Shop-manager

            # Configure and build:
            cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build

            # Run application:
            ./build/ShopManager
        - title: "🪟 Building from Source on Windows"
          content: "Compile on Windows using Visual Studio 2022 or MinGW64 with Qt 6 installed."
          code: |-
            # Clone repository in PowerShell:
            git clone https://github.com/jakej985-rgb/Shop-manager.git
            cd Shop-manager

            # Configure and build with MSVC:
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:\Qt\6.6.0\msvc2022_64"
            cmake --build build --config Release

            # Run executable:
            .\build\Release\ShopManager.exe

