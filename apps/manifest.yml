        notes:
          - "Multi-platform distribution across Android, Roku TV, Web PWA, and Docker backend."
          - "📱 Android APK release (AndroidCardGames-v0.1.28.apk) with touch-optimized controls and haptic dealing."
          - "📺 Roku TV client package (cardgames-roku-v0.1.28.zip) with big-screen tabletop layout and remote D-pad controls."
          - "🐳 Docker TV party server (ghcr.io/jakej985-rgb/android-card-games:v0.1.28) for self-hosted multi-room play."
