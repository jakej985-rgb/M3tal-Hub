# M3tal-Hub application registry
# enabled=false means the project is a placeholder until its integration plan is complete.

apps:
  - id: monster-lab
    name: Monster Lab
    repo: Monster-Lab
    path: Monster-Lab
    type: flutter-web
    platforms: [web, android, windows, linux, docker]
    enabled: true
    status: ready
    version: 0.0.1
    repo_url: https://github.com/jakej985-rgb/Monster-Lab
    release_url: https://github.com/jakej985-rgb/Monster-Lab/releases
    description: Robotics learning application with multi-platform simulation suite.
    base_href: /M3tal-Hub/Monster-Lab/
    install_guide:
      summary: "Monster Lab provides hands-on robotics and Arduino simulation across all major environments: an instant web simulator and PWA, native Android APK and AAB packages with USB OTG serial communication, Windows and Linux desktop binaries, and self-hosted Docker Compose container orchestration."
      prerequisites:
        - "🌐 Web / PWA: Modern web browser (Chrome, Edge, Firefox, Safari) with WebAssembly and Web Serial API support."
        - "🤖 Android: Android 8.0 (Oreo / API 26) or higher with USB Host / OTG support for physical Arduino connectivity."
        - "🪟 Windows: Windows 10 or Windows 11 (64-bit x64)."
        - "🐧 Linux: Debian 11+, Ubuntu 20.04+, or compatible Linux x86_64 distribution with GTK3 and libserialport."
        - "🐳 Docker: Docker Engine 20.10+ and Docker Compose v2."
      steps:
        - title: "🌐 Instant Web Simulator & PWA"
          content: "Run the full robotics curriculum and circuit simulator directly inside any modern browser, or install it as an offline-capable Progressive Web App (PWA)."
          code: |
            # Access directly via M3tal-Hub:
            https://jakej985-rgb.github.io/M3tal-Hub/Monster-Lab/

            # Progressive Web App (PWA) installation:
            # 1. Open the URL above in Chrome, Edge, or Safari.
            # 2. Click the 'Install App' or 'Add to Home Screen' icon in your browser address bar.
            # 3. Launch Monster Lab as a standalone window with offline caching support.
        - title: "🤖 Android APK & AAB Installation"
          content: "Install natively on Android smartphones and tablets. Pre-configured with USB Host permissions for connecting physical Arduino microcontrollers via USB-C OTG."
          code: |
            # Download release APK from GitHub Releases (v0.0.1):
            wget https://github.com/jakej985-rgb/Monster-Lab/releases/download/v0.0.1/monster-lab-android.apk

            # Sideload onto your connected Android device:
            adb install -r monster-lab-android.apk

            # For Google Play distribution or bundle inspection:
            # Download monster-lab-android.aab:
            wget https://github.com/jakej985-rgb/Monster-Lab/releases/download/v0.0.1/monster-lab-android.aab
            bundletool build-apks --bundle=monster-lab-android.aab --output=monster-lab.apks --mode=universal
            bundletool install-apks --apks=monster-lab.apks
        - title: "🪟 Windows Desktop Installer (.exe) & Portable Zip"
          content: "Run natively on Windows 64-bit with direct serial COM port access for Arduino flashing and real-time serial telemetry."
          code: |
            # Setup installer (.exe):
            Invoke-WebRequest -Uri "https://github.com/jakej985-rgb/Monster-Lab/releases/download/v0.0.1/monster-lab-windows.exe" -OutFile "monster-lab-windows.exe"
            .\monster-lab-windows.exe /VERYSILENT /NORESTART

            # Portable standalone zip (no installation or administrator privileges required):
            Invoke-WebRequest -Uri "https://github.com/jakej985-rgb/Monster-Lab/releases/download/v0.0.1/monster-lab-windows-portable.zip" -OutFile "monster-lab-windows-portable.zip"
            Expand-Archive -Path monster-lab-windows-portable.zip -DestinationPath .\MonsterLab
            .\MonsterLab\monster_lab.exe
        - title: "🐧 Linux Desktop Debian Package (.deb) & Portable Tarball"
          content: "Native Linux x64 desktop package with system menu integration, AppStream desktop entries, and dialout serial permissions for Arduino hardware."
          code: |
            # Debian / Ubuntu / Linux Mint (.deb):
            wget https://github.com/jakej985-rgb/Monster-Lab/releases/download/v0.0.1/monster-lab-linux.deb
            sudo dpkg -i monster-lab-linux.deb || sudo apt-get install -f -y

            # Add current user to dialout group for Arduino USB access:
            sudo usermod -aG dialout $USER

            # Portable standalone tarball (distro-independent):
            wget https://github.com/jakej985-rgb/Monster-Lab/releases/download/v0.0.1/monster-lab-linux-portable.tar.gz
            tar -xzf monster-lab-linux-portable.tar.gz
            ./monster_lab
        - title: "🐳 Docker Compose Simulation Orchestration"
          content: "Deploy the containerized web simulation suite in classrooms, lab clusters, or home server environments using pre-configured Docker Compose."
          code: |
            # Download release docker-compose.yml:
            curl -sSLO https://github.com/jakej985-rgb/Monster-Lab/releases/download/v0.0.1/docker-compose.yml

            # Launch containerized simulation service:
            docker compose up -d

            # Or run directly via Docker container image:
            docker run -d -p 8080:80 --name monster-lab-web ghcr.io/jakej985-rgb/monster-lab-web:v0.0.1

            # Access simulation dashboard:
            # Open browser to http://<your-host>:8080
    changelog:
      - version: 0.0.1
        date: "2026-09-30"
        tag: "v0.0.1 Multi-Platform Release"
        notes:
          - "Initial multi-platform release packaging across Web PWA, Android, Windows, Linux, and Docker."
          - "Android release assets (monster-lab-android.apk, monster-lab-android.aab) with USB Host OTG serial support."
          - "Windows desktop Inno Setup installer (monster-lab-windows.exe) and standalone portable bundle (monster-lab-windows-portable.zip)."
          - "Linux desktop Debian package (monster-lab-linux.deb), portable archive (monster-lab-linux-portable.tar.gz), and GPG archive keyring."
          - "Docker Compose simulation stack (docker-compose.yml) running ghcr.io/jakej985-rgb/monster-lab-web container image."
          - "Instant Web simulator and Progressive Web App (PWA) with offline service worker caching on M3tal-Hub."
          - "Full robotics curriculum: 12 lessons, 38 components, 20 guided projects, and interactive breadboard simulator."
          - "Interactive module editor with drag-and-drop circuit simulator."
          - "Optimized CanvasKit and HTML rendering pipelines."

