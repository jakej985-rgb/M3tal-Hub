  - id: red-music-locker
    name: Red Music Locker
    repo: red-music-locker
    path: red-music-locker
    type: flutter-web
    version: 0.0.1-beta
    platforms: [web, docker]
    enabled: true
    status: ready
    description: Self-hosted music locker audio streaming and YouTube Music synchronization service.
    base_href: /M3tal-Hub/red-music-locker/
    repo_url: https://github.com/jakej985-rgb/red-music-locker
    release_url: https://github.com/jakej985-rgb/red-music-locker/releases
    install_guide:
      summary: "Red Music Locker provides a responsive Web frontend for audio streaming and playlist management on M3tal-Hub, paired with a containerized YouTube Music background synchronization service using Docker Compose."
      prerequisites:
        - "Modern web browser for instant web player access (Chrome, Firefox, Safari, Edge)"
        - "Docker Engine >= 24.0 and Docker Compose v2.x for background sync container"
        - "Host audio directory containing your music collection (FLAC, MP3, AAC)"
      steps:
        - title: "Web Frontend Player Access"
          content: "Access the Flutter web audio player directly on M3tal-Hub. The web player connects to your self-hosted instance or runs with client-side audio caching. It can also be installed as a Progressive Web App (PWA) for offline access."
          code: |-
            # Direct web access:
            https://jakej985-rgb.github.io/M3tal-Hub/red-music-locker/
        - title: "Docker Sync Container Deployment"
          content: "Download the release compose specification ytsync.yml and copy default.env.example to .env. Configure your music library mount paths, config directory, and port:"
          code: |-
            # Download release specification & environment template:
            curl -fsSLO https://github.com/jakej985-rgb/red-music-locker/releases/download/v0.0.1-beta/ytsync.yml
            curl -fsSL https://github.com/jakej985-rgb/red-music-locker/releases/download/v0.0.1-beta/default.env.example -o .env || \
            curl -fsSL https://raw.githubusercontent.com/jakej985-rgb/red-music-locker/main/.env.example -o .env

            # Edit .env to set your MUSIC_PATH, CONFIG_PATH, and PORT
        - title: "Launch Background Sync Service"
          content: "Start the containerized sync service in detached mode. The service runs under an unprivileged user with read-only music directory mounts."
          code: |-
            docker compose -f ytsync.yml up -d
            docker compose -f ytsync.yml ps
            docker compose -f ytsync.yml logs -f ytm-sync
        - title: "Link YouTube Music Account"
          content: "Use the Red Music Locker Account Linker browser extension or auto-link utility to pair your YouTube Music library session with the self-hosted sync container."
    changelog:
      - version: 0.0.1-beta
        date: "2026-09-30"
        tag: "Web & Docker Release"
        notes:
          - "Self-hosted music locker audio streaming web interface deployed on M3tal-Hub."
          - "Docker container deployment with ytsync.yml and default.env.example configuration."
          - "Automated YouTube Music library synchronization and upload reconciliation engine."
          - "Unprivileged container execution with read-only host music storage protection."

  - id: red-music-locker-account-linker
    name: Red Music Locker Account Linker
    repo: red-music-locker-account-linker
    path: red-music-locker-account-linker
    type: extension
    version: 1.1.0
    platforms: [chrome, firefox]
    enabled: false
    status: placeholder
    description: Browser extension companion for 1-click YouTube Music account linking.
    repo_url: https://github.com/jakej985-rgb/red-music-locker-account-linker
    release_url: https://github.com/jakej985-rgb/red-music-locker-account-linker/releases
    install_guide:
      summary: "Lightweight browser companion extension for 1-click YouTube Music session linkage with your self-hosted Red Music Locker server. Available for Google Chrome and Mozilla Firefox."
      prerequisites:
        - "Google Chrome, Chromium, Brave, Microsoft Edge, or Mozilla Firefox"
        - "Active YouTube Music session on music.youtube.com"
        - "Running Red Music Locker container instance"
      steps:
        - title: "Google Chrome / Chromium Extension Installation"
          content: "1. Download 'red-music-locker-account-linker-chrome-v1.1.0.zip' from GitHub Releases.\n2. Extract the ZIP archive into a local folder.\n3. Open Chrome and navigate to 'chrome://extensions'.\n4. Enable the 'Developer mode' toggle in the upper right corner.\n5. Click 'Load unpacked' in the upper left and select the extracted folder containing manifest.json.\n6. Pin the Red Music Locker extension icon to your browser toolbar."
          code: |-
            # Download Chrome release package from GitHub Releases:
            wget https://github.com/jakej985-rgb/red-music-locker-account-linker/releases/download/v1.1.0/red-music-locker-account-linker-chrome-v1.1.0.zip

            # Unpack Chrome release package:
            unzip red-music-locker-account-linker-chrome-v1.1.0.zip -d chrome-linker/
            # In chrome://extensions -> Enable Developer Mode -> Click 'Load unpacked' -> Select chrome-linker/
        - title: "Mozilla Firefox Add-on Installation"
          content: "1. Download 'red-music-locker-account-linker-firefox-v1.1.0.zip' from GitHub Releases.\n2. Open Firefox and navigate to 'about:debugging#/runtime/this-firefox'.\n3. Click 'Load Temporary Add-on...'.\n4. Select 'red-music-locker-account-linker-firefox-v1.1.0.zip' or the manifest.json inside it.\n5. The extension will appear in your Firefox toolbar ready to link."
          code: |-
            # Download Firefox release package from GitHub Releases:
            wget https://github.com/jakej985-rgb/red-music-locker-account-linker/releases/download/v1.1.0/red-music-locker-account-linker-firefox-v1.1.0.zip

            # In Firefox about:debugging#/runtime/this-firefox:
            # Click 'Load Temporary Add-on...' -> Select red-music-locker-account-linker-firefox-v1.1.0.zip
        - title: "Connect to Red Music Locker Server"
          content: "1. Navigate to music.youtube.com in your browser and confirm you are signed in.\n2. Click the Red Music Locker icon on your browser toolbar.\n3. Enter your self-hosted server URL and click 'Link Account'. The extension securely forwards session headers directly to your server."
    changelog:
      - version: 1.1.0
        date: "2026-09-30"
        tag: "Dual Extension Release"
        notes:
          - "Chrome Manifest V3 package (red-music-locker-account-linker-chrome-v1.1.0.zip) with service worker background architecture."
          - "Firefox Manifest V3 package (red-music-locker-account-linker-firefox-v1.1.0.zip) adhering to AMO lint standards."
          - "1-click YouTube Music session cookie extraction without opening DevTools or copying headers."
          - "Direct session linkage to self-hosted Red Music Locker server instance."

