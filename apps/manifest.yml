# M3tal-Hub application registry
# enabled=false means the project is a placeholder until its integration plan is complete.

apps:
  - id: monster-lab
    name: Monster Lab
    repo: Monster-Lab
    path: Monster-Lab
    type: flutter-web
    enabled: true
    status: ready
    description: Robotics learning application.
    base_href: /M3tal-Hub/Monster-Lab/
    changelog:
      - version: 1.0.0
        date: "2026-09-30"
        tag: "Stable Release"
        notes:
          - "Production web release with full robotics simulation suite."
          - "Interactive module editor with drag-and-drop circuit simulator."
          - "Progressive Web App (PWA) offline caching support."
          - "Optimized CanvasKit and HTML rendering pipelines."

